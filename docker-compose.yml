version: '3.8'

services:
  # Shared base configuration
  scraper-base: &scraper-base
    build:
      context: ./agents/scrapers
      dockerfile: Dockerfile
    volumes:
      - ./data_engineering/bronze:/app/data/bronze
      - ./agents/scrapers/logs:/app/logs
    env_file:
      - ./agents/scrapers/.env

  scraper-cve:
    <<: *scraper-base
    container_name: scraper-cve
    command: python orchestrator.py --scraper=cve_mitre
    # In production, use cron or an external scheduler
    # restart: on-failure

  scraper-nvidia:
    <<: *scraper-base
    container_name: scraper-nvidia
    command: python orchestrator.py --scraper=nvidia

  scraper-intel:
    <<: *scraper-base
    container_name: scraper-intel
    command: python orchestrator.py --scraper=intel

  scraper-twitter:
    <<: *scraper-base
    container_name: scraper-twitter
    command: python orchestrator.py --scraper=twitter

  scraper-openai:
    <<: *scraper-base
    container_name: scraper-openai
    command: python orchestrator.py --scraper=openai

  # Orchestrator run all (optional manual trigger)
  scraper-all:
    <<: *scraper-base
    container_name: scraper-all
    command: python orchestrator.py --initial-load
    profiles:
      - manual
