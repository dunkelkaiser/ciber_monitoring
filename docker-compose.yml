version: '3.8'

services:
  # 1. API Gateway (Serves Gold Data)
  api:
    build: .
    container_name: ciber_api
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      - ciber_net
    restart: unless-stopped

  # 2. Scrapers Orchestrator (Runs Ingestion)
  scrapers:
    build: .
    container_name: ciber_scrapers
    command: python agents/scrapers/orchestrator.py --scraper all
    volumes:
      - ./:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
    ipc: host
    networks:
      - ciber_net
    profiles: [ "ingest" ]

  # 3. ETL Pipeline (Processes Bronze -> Gold)
  etl:
    build: .
    container_name: ciber_etl
    command: >
      sh -c "echo 'Starting Silver ETL...' && 
             python data_engineering/silver_etl.py && 
             echo 'Starting Gold ETL...' && 
             python data_engineering/gold_etl.py &&
             echo 'Building Vector Store...' &&
             python rag_system/build_vector_store.py"
    volumes:
      - ./:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - scrapers
    networks:
      - ciber_net
    profiles: [ "ingest" ]

  # 4. Gradio Assistant (Chatbot)
  chatbot:
    build: .
    container_name: ciber_chatbot
    command: python gradio_assistant/app.py
    ports:
      - "7860:7860"
    volumes:
      - ./:/app
    environment:
      - API_BASE_URL=http://api:8000/api/v1
      # IMPORTANT: Points to host for Ollama if running locally on Windows/Mac
      # If Linux, use http://172.17.0.1:11434 or network_mode: host
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
    depends_on:
      - api
    networks:
      - ciber_net

networks:
  ciber_net:
    driver: bridge
